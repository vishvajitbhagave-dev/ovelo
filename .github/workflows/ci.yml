name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app:
    name: App (typecheck, test, build)
    runs-on: ubuntu-latest
    env:
      # No secret is needed to typecheck, test or build. This is a harmless
      # placeholder so the build never has to see a real key.
      GEMINI_API_KEY: ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  escrow:
    name: Escrow (contract tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: escrow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: escrow/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Contract tests
        run: npm test
